  <!-- CONTACT -->
  <section style="position: relative; max-width: 1280px; margin: 0 auto; padding: 72px 24px 120px">
    <div aria-hidden="true" style="position: absolute; right: 6%; top: 110px; width: 380px; height: 380px; border-radius: 50%; background: #52645a; opacity: 0.55; filter: blur(90px)"></div>
    <div aria-hidden="true" style="position: absolute; right: 26%; top: 330px; width: 300px; height: 300px; border-radius: 50%; background: #b5193a; opacity: 0.4; filter: blur(100px)"></div>
    <div style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 64px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 40px">
        <div>
          <h1 style="margin: 0; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(64px, 9vw, 136px); line-height: 0.88; color: #ffffff">Talk with <span style="color: #a67c2e">us.</span></h1>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="kc-ghost" href="#" style="display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.28); color: #ffffff; font-weight: 500; text-decoration: none">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linejoin="round"></path></svg>WhatsApp
          </a>
          <a class="kc-ghost" href="#" style="display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.28); color: #ffffff; font-weight: 500; text-decoration: none">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#ffffff" stroke-width="1.6" fill="none"></rect><circle cx="12" cy="12" r="4" stroke="#ffffff" stroke-width="1.6" fill="none"></circle></svg>Instagram
          </a>
        </div>
      </div>

      <div style="border-radius: 32px; background: rgba(255,255,255,0.06); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 30px 80px rgba(0,0,0,0.45); padding: clamp(28px, 4vw, 48px)">
        
          <form id="kc-form" style="display: flex; flex-direction: column; gap: 18px">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 18px">
              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #e6ebe5">Name
                <input type="text" name="name" autocomplete="name" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: #0a0a0a; color: #ffffff; font: inherit; font-size: 16px">
              </label>
              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #e6ebe5">Email
                <input type="email" name="email" autocomplete="email" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: #0a0a0a; color: #ffffff; font: inherit; font-size: 16px">
              </label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #e6ebe5">Service
              <select name="service" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: #0a0a0a; color: #ffffff; font: inherit; font-size: 16px">
                <option>Video editing</option>
                <option>Social media management</option>
                <option>Graphic design</option>
                <option>AI animation</option>
                <option>Web development</option>
              </select>
            </label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #e6ebe5">Message
              <textarea name="message" rows="6" style="padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: #0a0a0a; color: #ffffff; font: inherit; font-size: 16px; resize: vertical"></textarea>
            </label>
            <button type="submit" class="kc-btn" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 16px 32px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: #e0405c; border: 1.5px solid #e0405c">
              <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10M8 3l4 4-4 4" stroke="#e0405c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Send message
            </button>
          </form>
        
        
          <div id="kc-sent" role="status" hidden style="display: flex; flex-direction: column; align-items: flex-start; gap: 20px; padding: 24px 0">
            <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" stroke="#f3dfae" stroke-width="2" fill="none"></circle><path d="M17 29l7 7 15-16" stroke="#f3dfae" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <h2 style="margin: 0; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 56px; line-height: 0.95; color: #ffffff">Message sent.</h2>
            <p style="margin: 0; color: #e6ebe5">Thanks for reaching out. We will reply within one working day.</p>
            <button type="button" class="kc-ghost" id="kc-reset" style="padding: 14px 24px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.28); background: transparent; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Send another</button>
          </div>
        
      </div>
    </div>
  </section>
